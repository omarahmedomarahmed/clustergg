# The gate on the money paths, and the only check branch protection needs.
#
# B74 / Gate 2 made this a control rather than a paragraph: a push that breaks
# the daily ceiling, the double-spend guard or the redemption claim fails here,
# visibly, before anybody notices it in production.
#
# ===== WHY IT USED TO RUN TWICE FOR EVERY CHANGE =====
#
# It triggered on `push` AND `pull_request`. For a branch in this repository
# with a PR open, GitHub fires both — the same commit, the same suites, twice,
# and branch protection waited for both. It now runs on every pull request and
# on pushes to `main` ONLY, which is one run per change plus one after a merge.
#
# ===== AND WHY IT WAS SLOW =====
#
# One job ran everything in series: type-check, then the money gate twice, then
# the whole database suite (which re-ran those same two suites inside it), then
# a build. That is a sum of every part. The work is now three jobs that run at
# the same time, so the wall clock is the slowest one rather than the total —
# and the duplicated runs inside `npm test` are gone.
#
# ===== ONE REQUIRED CHECK =====
#
# `ci` at the bottom does nothing except succeed when the other three have. It
# exists so branch protection can require a single name and keep requiring it
# while the jobs above are split, renamed or added to. Require `ci` and nothing
# else.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push supersedes an in-flight run on the same ref. Green on stale
  # code is worse than no signal, because somebody will read it as current.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== The money gate. Fastest, and the one that must never be merged around.
  gate:
    name: Money gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    # A REAL Postgres, with real separate connections.
    #
    # This service exists because of a due-diligence finding: the concurrency
    # suite ran only on PGlite, which is one in-process connection and therefore
    # serialises every writer for free. Gate 2 was green without ever having run
    # the failure mode it defends against. Against this service the lock is
    # genuinely contended — with `FOR UPDATE` removed, the suite fails.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clustertest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Types first: it is the fastest thing that can be wrong, and a type error
      # makes every failure after it harder to read.
      - name: Type-check
        run: npx tsc --noEmit

      # The PGlite run of this suite happens inside the full suite job. What is
      # unique here is the REAL lock across real connections, so that is what
      # this job runs — running both again would be the duplication this
      # workflow was rewritten to remove.
      - name: Money integrity — real Postgres, real lock (Gate 2)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clustertest
        run: npx tsx tests/db/concurrency.mts

  # ===== Everything else the database can prove.
  suite:
    name: Database suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes Phase-0 integrity and the PGlite half of the money gate.
      - name: Full database suite
        # No lane override. I assumed these suites were I/O-bound and would
        # benefit from more lanes than cores; measured, six lanes took 414s
        # against 302s at three. PGlite is WebAssembly running in-process — it
        # burns CPU, it does not wait on a socket — so the core count is the
        # right number and oversubscribing costs a third of the run.
        run: npm test

  # ===== The failure class `tsc` cannot see.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Next's own cache, keyed on the lockfile and the source. A cold build is
      # most of this job.
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-

      # Next traces the module graph across the client boundary even for
      # type-only and dynamic imports, so a server-only module reached from a
      # client component fails HERE while the type-check stays green. It has
      # cost this project days more than once.
      - name: Build
        run: DEMO_DB=1 npm run build

  # ===== The one name branch protection should require.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [gate, suite, build]
    if: always()
    steps:
      # `needs` alone does not fail this job when a dependency fails while
      # `if: always()` is set — it would be skipped, and a skipped required
      # check reads as passing on some settings. So the result is asserted.
      - name: Every check passed
        run: |
          echo "gate=${{ needs.gate.result }} suite=${{ needs.suite.result }} build=${{ needs.build.result }}"
          test "${{ needs.gate.result }}" = "success"
          test "${{ needs.suite.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
